name: Build Windows ZIPs

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.12'
          architecture: x64

      - name: Install build and test tools
        run: python -m pip install --disable-pip-version-check meson==1.9.1 ninja==1.13.0 pywin32==311

      - name: Download Engine dependencies and compile Blu-ray libraries
        run: python tools/prepare-ci.py "$env:RUNNER_TEMP/inputs"

      - name: Build, test and package
        id: package
        run: |
          $inputsDir = Join-Path $env:RUNNER_TEMP 'inputs'
          $env:PATH = (Join-Path $inputsDir 'bin') + ';' + $env:PATH
          $out = Join-Path $env:RUNNER_TEMP 'packages'
          ./build-release.ps1 -WorkDirectory "$env:RUNNER_TEMP/build" -OutputDirectory $out -RuntimeDirectory "$inputsDir/runtime" -BuiltBlurayDirectory "$inputsDir/bluray"
          $sources = @(Get-ChildItem -LiteralPath $out -File -Filter '*_source.zip')
          if ($sources.Count -ne 1) { throw 'Expected one source ZIP.' }
          $binary = Get-Item -LiteralPath (Join-Path $out ($sources[0].Name -replace '_source\.zip$', '.zip'))
          "binary=$($binary.FullName)" >> $env:GITHUB_OUTPUT
          "source=$($sources[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Save the application ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.binary }}
          archive: false
          if-no-files-found: error

      - name: Save the source ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.source }}
          archive: false
          if-no-files-found: error
